<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merry Christmas · 电子圣诞树</title>
<style>
  :root{
    --bg:#040309;
    --cream:#f9f0e3;
    --accent:#bfe4fb;
    --accent2:#8ec9ee;
    --title2:#6fb6e8;
    --archRim:rgba(178,216,240,.18);
    --archRim2:rgba(178,216,240,.06);
    --archGlow:rgba(40,108,152,.20);
    --serif:"Century","Sitka Display","Playfair Display","Bodoni 72",Georgia,"Times New Roman",serif;
    --zh:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --ui:"Segoe UI","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{background:var(--bg)}
  body{
    margin:0; overflow:hidden; background:var(--bg); color:#cfc5da;
    font-family:var(--ui); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  html.still *{transition:none!important; animation:none!important}
  #gl{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0}

  /* 拱形门洞 */
  .arch{position:fixed; z-index:1; pointer-events:none; opacity:0; transition:opacity 2.6s ease .1s}
  .arch.show{opacity:1}
  .arch .a1,.arch .a2{position:absolute; inset:0; border:1px solid var(--archRim); border-bottom:0;
    border-radius:50% 50% 0 0/46% 46% 0 0}
  .arch .a2{inset:-14px -14px 0 -14px; border-color:var(--archRim2)}
  .arch .glow{position:absolute; inset:-6% -22% 0 -22%; border-radius:50% 50% 0 0/46% 46% 0 0;
    background:radial-gradient(54% 48% at 50% 66%, var(--archGlow), transparent 74%);
    filter:blur(16px)}

  /* 左栏文案 */
  .copy{
    position:fixed; z-index:3; left:13.0vw; top:50%;
    transform:translateY(-50%); width:min(33ch,32vw); pointer-events:none;
  }
  .copy>*{opacity:0; transform:translateY(18px); transition:opacity 2s cubic-bezier(.2,.65,.3,1), transform 2s cubic-bezier(.2,.65,.3,1)}
  .copy>*:nth-child(2){transition-delay:.14s}
  .copy .in{opacity:1; transform:none}
  .kicker{
    font-family:var(--serif); font-size:clamp(7px,.55vw,9.5px); letter-spacing:.42em;
    text-transform:uppercase; color:#bfb0d0; margin:0 0 clamp(15px,2.0vw,33px); white-space:nowrap;
  }
  h1{
    margin:0; font-family:var(--serif); font-weight:400;
    font-size:clamp(40px,5.9vw,142px); line-height:.93; letter-spacing:-.014em; color:var(--cream);
    text-shadow:0 0 72px rgba(255,224,232,.10);
  }
  h1 .l2{display:block; margin-top:.03em}
  h1 em{
    font-style:italic; letter-spacing:-.02em;
    background:linear-gradient(96deg,var(--accent) 2%,var(--accent2) 34%,var(--title2) 74%,var(--accent2) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent; padding-right:.10em;
    transition:background .8s ease;
  }
  .rule{width:clamp(26px,2.9vw,46px); height:1px; background:rgba(226,214,240,.30);
        margin:clamp(16px,2.0vw,32px) 0 clamp(13px,1.7vw,25px)}
  .zh{font-family:var(--zh); font-size:clamp(10px,.82vw,12.6px); line-height:2.4; letter-spacing:.10em;
      color:#cdc3d9; margin:0 0 clamp(6px,.85vw,12px); font-weight:300}
  .en{font-family:var(--serif); font-style:italic; font-size:clamp(10px,.78vw,12.2px); line-height:1.95;
      letter-spacing:.016em; color:#a698c7; margin:0}

  /* 底部控制条 */
  .dock{
    position:fixed; z-index:4; left:50%; bottom:clamp(20px,3.8vh,44px);
    display:flex; align-items:center; padding:0 4px;
    background:rgba(16,12,24,.58); border:1px solid rgba(255,255,255,.07);
    border-radius:999px; backdrop-filter:blur(16px) saturate(1.1); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
    opacity:0; transform:translate(-50%,8px);
    transition:opacity 1.4s ease, transform 1.4s cubic-bezier(.2,.65,.3,1);
  }
  .dock.show{opacity:1; transform:translate(-50%,0)}
  .dock button{
    all:unset; cursor:pointer; padding:11px 21px; font-size:clamp(10.5px,.76vw,12.4px); color:#ccc3d8;
    letter-spacing:.08em; border-radius:999px; transition:color .25s, background .25s; white-space:nowrap;
  }
  .dock button:hover{color:#fff; background:rgba(255,255,255,.06)}
  .dock button:focus-visible{outline:1px solid rgba(255,255,255,.35)}
  .dock .sep{width:1px; height:12px; background:rgba(255,255,255,.09); flex:none}
  .dock button.on{color:#f7d6e6}

  .tip{position:fixed; z-index:4; left:50%; bottom:calc(clamp(20px,3.8vh,44px) + 48px); transform:translateX(-50%);
    font-size:11px; letter-spacing:.24em; color:rgba(200,186,216,.42); opacity:0; transition:opacity 1.4s ease;
    pointer-events:none; white-space:nowrap}
  .tip.show{opacity:1}

  /* 顶部中央题记 */
  .noel{
    position:fixed; z-index:3; top:clamp(18px,3.4vh,38px); left:50%; transform:translateX(-50%);
    font-family:var(--serif); font-style:italic; font-size:clamp(10px,.80vw,12.5px);
    letter-spacing:.10em; color:rgba(212,198,232,.40); white-space:nowrap;
    opacity:0; transition:opacity 2.2s ease .4s; pointer-events:none;
  }
  .noel.show{opacity:1}

  /* 调色板面板 */
  .palette{
    position:fixed; z-index:5; left:50%; bottom:calc(clamp(20px,3.8vh,44px) + 58px);
    transform:translate(-50%,10px); width:min(94vw,366px);
    background:rgba(18,14,26,.88); border:1px solid rgba(255,255,255,.09);
    border-radius:18px; padding:13px 15px 15px;
    backdrop-filter:blur(20px) saturate(1.15); -webkit-backdrop-filter:blur(20px);
    box-shadow:0 18px 56px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.06);
    opacity:0; pointer-events:none;
    transition:opacity .32s ease, transform .32s cubic-bezier(.2,.65,.3,1);
  }
  .palette.show{opacity:1; pointer-events:auto; transform:translate(-50%,0)}
  .palette-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .palette-head b{font-weight:400;font-size:11px;letter-spacing:.30em;color:#a99ec2;text-transform:uppercase}
  .palette-head button{
    all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;
    border-radius:50%;color:#8f83a6;font-size:15px;line-height:1;transition:background .2s,color .2s;
  }
  .palette-head button:hover{background:rgba(255,255,255,.08);color:#fff}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .sw{
    all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:8px 2px 7px;border-radius:12px;transition:background .25s;
  }
  .sw:hover{background:rgba(255,255,255,.06)}
  .sw.sel{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .sw .chips{display:flex;gap:3px}
  .sw i{display:block;width:8px;height:26px;border-radius:3px;box-shadow:0 0 10px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14)}
  .sw span{font-size:10.5px;letter-spacing:.08em;color:#a99ec2;white-space:nowrap}
  .sw.sel span,.sw:hover span{color:#fff}
  .palette-note{margin:9px 2px 0;font-size:10px;letter-spacing:.12em;color:rgba(169,158,194,.5)}

  /* 装饰面板 */
  .decor-kinds{display:flex;gap:6px;margin-bottom:10px}
  .decor-kinds button{
    all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 4px;border-radius:10px;
    font-size:11px;letter-spacing:.06em;color:#a99ec2;background:rgba(255,255,255,.04);
    transition:background .2s,color .2s,box-shadow .2s;
  }
  .decor-kinds button:hover{background:rgba(255,255,255,.09);color:#fff}
  .decor-kinds button.sel{background:rgba(255,255,255,.11);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .decor-colors{grid-template-columns:repeat(8,1fr);gap:5px;margin-bottom:12px}
  .decor-colors .dot{
    all:unset;cursor:pointer;width:100%;aspect-ratio:1;border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.16), inset 0 -3px 6px rgba(0,0,0,.35);
    transition:transform .18s, box-shadow .18s;
  }
  .decor-colors .dot:hover{transform:scale(1.12)}
  .decor-colors .dot.sel{box-shadow:0 0 0 2px #fff, 0 0 10px rgba(255,255,255,.5), inset 0 -3px 6px rgba(0,0,0,.35)}
  .decor-actions{display:flex;gap:7px}
  .decor-actions button{
    all:unset;cursor:pointer;flex:1;text-align:center;padding:9px 6px;border-radius:10px;
    font-size:11px;letter-spacing:.06em;color:#cfc6dc;background:rgba(255,255,255,.055);
    transition:background .2s,color .2s;
  }
  .decor-actions button:hover{background:rgba(255,255,255,.12);color:#fff}
  .decor-actions button.primary{background:rgba(150,190,240,.18);color:#cfe6ff}
  .decor-actions button.primary:hover{background:rgba(150,190,240,.30);color:#fff}
  .style-slider{display:flex;align-items:center;gap:9px;margin:2px 0 10px}
  .style-slider label{font-size:11px;letter-spacing:.08em;color:#a99ec2;flex:none}
  .style-slider input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer;
  }
  .style-slider input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#dce9f6;box-shadow:0 0 8px rgba(180,220,255,.6);cursor:pointer;
  }
  .style-slider input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:none;border-radius:50%;background:#dce9f6;cursor:pointer;
  }
  .style-slider span{font-size:11px;color:#8e84a8;width:38px;text-align:right;flex:none}
  .decor-hint{
    position:fixed;z-index:4;left:50%;transform:translateX(-50%);
    bottom:calc(clamp(20px,3.8vh,44px) + 52px);
    font-size:11px;letter-spacing:.18em;color:rgba(190,220,245,.55);
    opacity:0;transition:opacity .6s ease;pointer-events:none;white-space:nowrap;
  }
  .decor-hint.show{opacity:1}
  body.decor-mode #gl{cursor:crosshair}
  .toast{
    position:fixed;z-index:9;left:50%;bottom:calc(clamp(20px,3.8vh,44px) + 110px);
    transform:translate(-50%,8px);padding:9px 18px;border-radius:999px;
    background:rgba(20,26,36,.92);border:1px solid rgba(255,255,255,.12);
    color:#dbe9f7;font-size:12px;letter-spacing:.06em;white-space:nowrap;
    opacity:0;transition:opacity .3s ease, transform .3s ease;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:900px){
    #gl{transform:translateY(-17%) scale(0.96); transform-origin:50% 50%}
    .copy{left:7vw; width:min(86vw,29ch); top:auto; bottom:11vh; transform:none}
    .copy>*{transform:translateY(12px)}
    .copy .in{transform:none}
    .kicker{font-size:8px; letter-spacing:.34em; margin-bottom:12px}
    h1{font-size:clamp(34px,10vw,54px)}
    .rule{margin:12px 0 10px}
    .zh{font-size:11px; line-height:2.05; margin-bottom:5px}
    .en{font-size:10.5px; line-height:1.7}
    .arch{display:none!important}
    .dock{bottom:16px; padding:0 2px}
    .dock button{padding:10px 12px}
    .tip{bottom:72px}
    .palette{bottom:calc(16px + 56px); width:min(94vw,340px); padding:11px 12px 13px}
    .sw{padding:7px 1px 6px; gap:5px}
    .sw i{width:7px;height:22px}
    .sw span{font-size:9.5px}
    .decor-kinds button{font-size:10px;padding:7px 2px}
    .decor-actions button{font-size:10px;padding:8px 3px}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="arch" id="arch">
  <div class="glow"></div>
  <div class="a2"></div>
  <div class="a1"></div>
</div>

<div class="copy" id="copy">
  <p class="kicker" id="k1">The art of a little christmas magic</p>
  <h1 id="k2">Merry<span class="l2"><em>Christmas.</em></span></h1>
  <div class="rule" id="k3"></div>
  <p class="zh" id="k4">愿你心有暖阳，眼有星光。</p>
  <p class="zh" id="k5">所念皆如愿，岁岁皆平安。</p>
  <p class="en" id="k6">May your days be merry, bright,<br>and full of little wonders.</p>
</div>

<div class="noel" id="noel">Noël · a wish beneath the stars.</div>
<div class="tip" id="tip">点击任意处 · 许一个愿</div>

<div class="dock" id="dock">
  <button id="btnSnow">暂停飘雪</button>
  <span class="sep"></span>
  <button id="btnWish">再许个愿</button>
  <span class="sep"></span>
  <button id="btnPalette">调色板</button>
  <span class="sep"></span>
  <button id="btnDecor">装饰</button>
  <span class="sep"></span>
  <button id="btnStyle">质感</button>
  <span class="sep"></span>
  <button id="btnFull">全屏欣赏</button>
</div>

<div class="palette" id="palette" role="dialog" aria-label="调色板">
  <div class="palette-head">
    <b>调色板</b>
    <button id="btnPaletteClose" aria-label="关闭">×</button>
  </div>
  <div class="swatches" id="swatches"></div>
  <p class="palette-note">切换配色 · 树、缎带、装饰与星芒一并更换</p>
</div>

<div class="palette" id="decorPanel" role="dialog" aria-label="装饰圣诞树">
  <div class="palette-head">
    <b>装饰圣诞树</b>
    <button id="btnDecorClose" aria-label="关闭">×</button>
  </div>
  <div class="decor-kinds" id="decorKinds"></div>
  <div class="swatches decor-colors" id="decorColors"></div>
  <div class="decor-actions">
    <button id="btnUndo">撤销</button>
    <button id="btnClear">清空</button>
    <button id="btnCopy" class="primary">复制永久链接</button>
  </div>
  <p class="palette-note" id="decorNote">点树上任意位置放置 · 链接会记住你的装饰</p>
</div>

<div class="palette" id="stylePanel" role="dialog" aria-label="质感">
  <div class="palette-head">
    <b>画面质感</b>
    <button id="btnStyleClose" aria-label="关闭">×</button>
  </div>
  <div class="decor-kinds" id="styleKinds">
    <button type="button" data-m="0" class="sel">原画</button>
    <button type="button" data-m="1">漫画</button>
    <button type="button" data-m="2">油画</button>
  </div>
  <div class="style-slider">
    <label>强度</label>
    <input id="styleAmt" type="range" min="0" max="1" step="0.01" value="1">
    <span id="styleAmtVal">100%</span>
  </div>
  <p class="palette-note">漫画＝赛璐璐平涂＋描边＋网点；油画＝笔触拖扫＋厚涂＋画布纹理</p>
</div>

<script>
"use strict";
/* =====================================================================
   Merry Christmas · 电子圣诞树
   WebGL 运行时程序化生成：分层锥体 / 缎带 / 球饰 / 礼盒 / 雪 / 星芒
   ===================================================================== */

const QS=new URLSearchParams(location.search);
const FIXED_T=QS.has('t')?parseFloat(QS.get('t')):null;
const QS_STYLE=QS.has('style')?parseInt(QS.get('style'),10):null;
if(FIXED_T!==null) document.documentElement.classList.add('still');

const canvas=document.getElementById('gl');
const gl=canvas.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){
  document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:grid;place-items:center;color:#c9b8e6;font:14px sans-serif;z-index:9">此浏览器不支持 WebGL</div>');
  throw new Error('no webgl');
}

/* ---------- 数学 ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=0,b=1)=>a+Math.random()*(b-a);
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};

function perspective(out,fovy,aspect,near,far){
  const f=1/Math.tan(fovy/2),nf=1/(near-far);
  out[0]=f/aspect;out[1]=0;out[2]=0;out[3]=0;
  out[4]=0;out[5]=f;out[6]=0;out[7]=0;
  out[8]=0;out[9]=0;out[10]=(far+near)*nf;out[11]=-1;
  out[12]=0;out[13]=0;out[14]=2*far*near*nf;out[15]=0;
  return out;
}
function lookAt(out,ex,ey,ez,cx,cy,cz){
  let zx=ex-cx,zy=ey-cy,zz=ez-cz;
  let l=Math.hypot(zx,zy,zz)||1;zx/=l;zy/=l;zz/=l;
  let xx=zz,xy=0,xz=-zx;
  l=Math.hypot(xx,xy,xz);if(l<1e-6){xx=1;xy=0;xz=0;l=1;}xx/=l;xy/=l;xz/=l;
  const yx=zy*xz-zz*xy,yy=zz*xx-zx*xz,yz=zx*xy-zy*xx;
  out[0]=xx;out[1]=yx;out[2]=zx;out[3]=0;
  out[4]=xy;out[5]=yy;out[6]=zy;out[7]=0;
  out[8]=xz;out[9]=yz;out[10]=zz;out[11]=0;
  out[12]=-(xx*ex+xy*ey+xz*ez);
  out[13]=-(yx*ex+yy*ey+yz*ez);
  out[14]=-(zx*ex+zy*ey+zz*ez);
  out[15]=1;
  return out;
}

/* ---------- 树体轮廓：分层裙摆 ---------- */
const H=3.02, R0=1.075, NT=6.0;
function coneR(t){
  t=clamp(t,0,1);
  const base=R0*Math.pow(1-t,0.84);              // 整体锥形（下宽上收）
  const tt=t*NT, i=Math.floor(tt), f=tt-i;
  const skirt=1.075-0.145*Math.pow(f,0.48);       // 每层：底外翻、顶收进（柔和裙摆）
  const step=1-0.006*i;
  const round=1+0.020*Math.exp(-Math.pow((1-t)*7.0,2.0));   // 底部圆收
  const cap=1-0.26*Math.exp(-Math.pow((1-t)*15.0,2.2));     // 顶端收尖
  return base*skirt*step*round*cap;
}
const TREE_MID=H*0.5;

/* ---------- WebGL 基础 ---------- */
function compile(src,type){
  const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs,fs,attrs){
  const p=gl.createProgram();
  gl.attachShader(p,compile(vs,gl.VERTEX_SHADER));
  gl.attachShader(p,compile(fs,gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const o={program:p,a:{},u:{}};
  attrs.forEach(n=>o.a[n]=gl.getAttribLocation(p,n));
  const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){const inf=gl.getActiveUniform(p,i);o.u[inf.name]=gl.getUniformLocation(p,inf.name);}
  return o;
}
function staticBuf(arr){
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr instanceof Float32Array?arr:new Float32Array(arr),gl.STATIC_DRAW);
  return b;
}
function dynBuf(arr){
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,arr instanceof Float32Array?arr:new Float32Array(arr),gl.DYNAMIC_DRAW);
  return b;
}

/* ---------- 着色器 ---------- */
const VS_BG=`attribute vec2 aPos;varying vec2 vUv;
void main(){vUv=aPos;gl_Position=vec4(aPos,0.0,1.0);}`;
const FS_BG=`precision highp float;varying vec2 vUv;
uniform vec3 uBg, uBgDeep, uGlow1, uGlow2;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  float r=length(vUv*vec2(0.74,1.0));
  vec3 c=mix(uBg,uBgDeep,smoothstep(0.02,1.10,r));
  c+=uGlow1*exp(-pow((vUv.x+0.44)*2.5,2.0))*exp(-pow((vUv.y+0.06)*1.7,2.0));
  c+=uGlow2*exp(-pow((vUv.x-0.46)*2.1,2.0))*exp(-pow((vUv.y+0.34)*1.9,2.0));
  c+=uGlow1*0.55*exp(-pow((vUv.x-0.10)*2.4,2.0))*exp(-pow((vUv.y-0.64)*2.6,2.0));
  c+=(hash(gl_FragCoord.xy)-0.5)*0.006;
  gl_FragColor=vec4(c,1.0);
}`;

const ROT_HEAD=`
uniform float uRot;
vec2 rotXZ(vec2 v){float c=cos(uRot),s=sin(uRot);return vec2(v.x*c+v.y*s,-v.x*s+v.y*c);}
`;

const VS_PT=`
attribute vec3 aPos;attribute vec3 aCol;attribute float aSize;attribute float aSeed;
uniform mat4 uProj;uniform mat4 uView;
uniform float uFocal,uTime,uGrow,uR0,uShift,uShiftY,uAlpha,uTwinkle;
${ROT_HEAD}
varying vec3 vCol;varying float vA;varying float vY;
void main(){
  vec3 p=aPos;
  p.xz=rotXZ(p.xz);
  float rr=length(p.xz);
  float nr=mix(uR0,rr,uGrow);
  p.xz*=(rr>0.0001)?(nr/rr):1.0;
  p.y*=uGrow;
  vY=p.y;
  vec4 mv=uView*vec4(p,1.0);
  vec4 cl=uProj*mv;
  cl.x+=uShift*cl.w;
  cl.y+=uShiftY*cl.w;
  gl_Position=cl;
  float dist=max(0.30,-mv.z);
  gl_PointSize=clamp(aSize*uFocal/dist,0.55,64.0);
  float tw=0.38+0.62*(0.5+0.5*sin(uTime*2.2+aSeed*63.0))*(0.55+0.45*sin(uTime*0.81+aSeed*19.0));
  vCol=aCol;
  vA=mix(1.0,clamp(0.24+tw*1.02,0.10,1.35),uTwinkle)*uAlpha;
}`;
const FS_PT=`precision mediump float;varying vec3 vCol;varying float vA;varying float vY;
uniform mat3 uHue;uniform vec3 uTint,uLift,uDark;uniform float uSat;
vec3 grade(vec3 c){
  float l=dot(c,vec3(0.299,0.587,0.114));
  vec3 h=uHue*c;
  h=mix(vec3(l),h,uSat)*uTint+uLift;
  /* 暗部（树体枝叶）：按高度在深色与点缀色之间过渡，避免整棵树被旋转成怪色 */
  vec3 dk = mix(uDark, uDark*1.9+vec3(0.030,0.045,0.055), smoothstep(0.0,2.6,vY));
  return mix(h,dk,1.0-smoothstep(0.08,0.26,l));
}
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=length(d)*2.0;
  if(r>1.0)discard;
  float a=pow(smoothstep(1.0,0.0,r),1.75);
  gl_FragColor=vec4(grade(vCol)*(0.6+0.8*a),a*vA);
}`;

const VS_MS=`
attribute vec3 aPos;attribute vec3 aNrm;attribute vec3 aCol;attribute float aAlpha;attribute float aShine;
uniform mat4 uProj;uniform mat4 uView;
uniform float uGrow,uR0,uShift,uShiftY,uAlpha;
${ROT_HEAD}
varying vec3 vN;varying vec3 vP;varying vec3 vCol;varying float vA;varying float vS;
void main(){
  vec3 p=aPos;
  p.xz=rotXZ(p.xz);
  float rr=length(p.xz);
  float nr=mix(uR0,rr,uGrow);
  p.xz*=(rr>0.0001)?(nr/rr):1.0;
  p.y*=uGrow;
  vP=p;
  vec2 nn=rotXZ(aNrm.xz);
  vN=vec3(nn.x,aNrm.y,nn.y);
  vCol=aCol;vA=aAlpha*uAlpha;vS=aShine;
  vec4 cl=uProj*uView*vec4(p,1.0);
  cl.x+=uShift*cl.w;
  cl.y+=uShiftY*cl.w;
  gl_Position=cl;
}`;
const FS_MS=`precision highp float;
varying vec3 vN;varying vec3 vP;varying vec3 vCol;varying float vA;varying float vS;
uniform vec3 uLight;uniform vec3 uFill;uniform vec3 uCam;
uniform mat3 uHue;uniform vec3 uTint,uLift,uDark,uLock;uniform float uSat,uLockAmt;
vec3 grade(vec3 c){
  float l=dot(c,vec3(0.299,0.587,0.114));
  vec3 h=uHue*c;
  h=mix(vec3(l),h,uSat)*uTint+uLift;
  h=mix(h,uDark,1.0-smoothstep(0.08,0.26,l));
  return mix(h,uLock*c,uLockAmt);
}
void main(){
  vec3 N=normalize(vN);
  vec3 V=normalize(uCam-vP);
  if(dot(N,V)<0.0)N=-N;
  vec3 L=normalize(uLight);
  float d=max(dot(N,L),0.0);
  float f=max(dot(N,normalize(uFill)),0.0);
  float rim=pow(1.0-max(dot(N,V),0.0),3.0);
  vec3 base=grade(vCol);
  vec3 col=base*(0.30+0.72*d+0.26*f)+base*rim*0.45*vS;
  float spec=pow(max(dot(reflect(-L,N),V),0.0),46.0);
  col+=vec3(1.0,0.94,0.84)*spec*0.8*vS;
  gl_FragColor=vec4(col,clamp(vA,0.0,1.0));
}`;

const VS_FL=`
attribute vec3 aPos;
uniform mat4 uProj;uniform mat4 uView;uniform float uShift,uShiftY,uFocal,uSize;
void main(){
  vec4 mv=uView*vec4(aPos,1.0);
  vec4 cl=uProj*mv;
  cl.x+=uShift*cl.w;
  cl.y+=uShiftY*cl.w;
  gl_Position=cl;
  gl_PointSize=clamp(uSize*uFocal/max(0.4,-mv.z),2.0,900.0);
}`;
const FS_FL=`precision highp float;
uniform vec3 uTint;uniform float uIntensity;
void main(){
  vec2 d=gl_PointCoord-0.5;
  float r=length(d)*2.0;
  if(r>1.0)discard;
  float core=exp(-r*r*7.0);
  float halo=exp(-r*3.0)*0.16;
  float rx=exp(-abs(d.y)*230.0)*exp(-abs(d.x)*5.5)*0.28;
  float ry=exp(-abs(d.x)*230.0)*exp(-abs(d.y)*5.5)*0.28;
  float a=(core*0.55+halo+rx+ry)*uIntensity;
  a*=1.0-smoothstep(0.55,1.0,r);
  gl_FragColor=vec4(uTint*a,a);
}`;

const P_BG=program(VS_BG,FS_BG,['aPos']);
const P_PT=program(VS_PT,FS_PT,['aPos','aCol','aSize','aSeed']);
const P_MS=program(VS_MS,FS_MS,['aPos','aNrm','aCol','aAlpha','aShine']);
const P_FL=program(VS_FL,FS_FL,['aPos']);
/* ---------- 后处理：质感风格（漫画 / 油画） ---------- */
const COMMON_FN=`
float lum(vec3 c){return dot(c,vec3(0.299,0.587,0.114));}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vnoise(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash2(i),b=hash2(i+vec2(1.0,0.0)),cc=hash2(i+vec2(0.0,1.0)),d=hash2(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(cc,d,f.x),f.y);
}
float fbm(vec2 p){
  float v=0.0,a=0.5;
  for(int i=0;i<5;i++){v+=a*vnoise(p);p=p*2.03+vec2(1.7,9.2);a*=0.5;}
  return v;
}
vec3 lift(vec3 c,float gain){
  c=clamp(c*gain,0.0,1.0);
  return pow(c,vec3(0.86));
}
`;

const VS_POST=`attribute vec2 aPos;varying vec2 vUv;
void main(){vUv=aPos*0.5+0.5;gl_Position=vec4(aPos,0.0,1.0);}`;

/* 漫画 / 国漫上色 */
const FS_POST_COMIC=`precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;uniform vec2 uTexel;uniform float uAmt;
${COMMON_FN}
vec3 S(vec2 uv){return lift(texture2D(uTex,uv).rgb,2.45);}
void main(){
  float t=clamp(uAmt,0.0,1.0);
  vec3 raw=texture2D(uTex,vUv).rgb;
  vec3 base=S(vUv);

  vec3 acc=vec3(0.0);float ws=0.0;
  for(int i=-3;i<=3;i++){
    for(int j=-3;j<=3;j++){
      vec3 s=S(vUv+vec2(float(i),float(j))*uTexel*2.0);
      float d=length(s-base);
      float w=exp(-d*d*30.0);
      acc+=s*w;ws+=w;
    }
  }
  vec3 flatC=acc/max(ws,0.0001);

  float l=lum(flatC);
  /* 极暗处不分阶，直接保原色，避免夜空出现色块 */
  float qMask=smoothstep(0.045,0.14,l);
  float L=clamp(floor(l*4.5+0.5)/4.5,0.0,1.0);
  L=mix(l,L,qMask);
  vec3 chroma=clamp(flatC/max(l,0.05),0.0,2.4);
  vec3 cell=chroma*L;
  float g=lum(cell);
  cell=mix(cell,mix(vec3(g),cell,1.85),0.82);
  cell=mix(cell,vec3(0.055,0.075,0.150),smoothstep(0.14,0.01,l)*0.45);

  float tl=lum(S(vUv+vec2(-1.0,-1.0)*uTexel*1.35));
  float tt=lum(S(vUv+vec2( 0.0,-1.0)*uTexel*1.35));
  float tr=lum(S(vUv+vec2( 1.0,-1.0)*uTexel*1.35));
  float ml=lum(S(vUv+vec2(-1.0, 0.0)*uTexel*1.35));
  float mr=lum(S(vUv+vec2( 1.0, 0.0)*uTexel*1.35));
  float bl=lum(S(vUv+vec2(-1.0, 1.0)*uTexel*1.35));
  float bb=lum(S(vUv+vec2( 0.0, 1.0)*uTexel*1.35));
  float br=lum(S(vUv+vec2( 1.0, 1.0)*uTexel*1.35));
  float gx=-tl-2.0*ml-bl+tr+2.0*mr+br;
  float gy=-tl-2.0*tt-tr+bl+2.0*bb+br;
  float edge=sqrt(gx*gx+gy*gy);
  float line=smoothstep(0.20,0.52,edge);
  line*=smoothstep(0.015,0.09,l);

  vec2 px=gl_FragCoord.xy;
  float ang=0.6;
  vec2 rp=vec2(cos(ang)*px.x-sin(ang)*px.y,sin(ang)*px.x+cos(ang)*px.y);
  float dd=length(fract(rp/5.2)-0.5);
  float shade=smoothstep(0.36,0.12,l);
  float dotR=mix(0.0,0.42,shade);
  float ht=1.0-smoothstep(dotR-0.055,dotR+0.055,dd);
  cell=mix(cell,cell*0.72,ht*shade*0.55);

  vec3 outC=mix(cell,vec3(0.030,0.028,0.055),line*0.92);
  outC+=(hash2(px)-0.5)*0.016;
  vec2 q=vUv-0.5;
  outC*=1.0-dot(q,q)*0.30;

  /* 背景遮罩：夜空保持原样，只风格化主体 */
  float mask=smoothstep(0.035,0.115,lum(raw));
  outC=mix(raw,outC,mask);
  gl_FragColor=vec4(clamp(mix(raw,outC,t),0.0,1.0),1.0);
}`;

/* 油画 */
const FS_POST_OIL=`precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;uniform vec2 uTexel;uniform float uAmt;
${COMMON_FN}
vec3 S(vec2 uv){
  vec3 c=texture2D(uTex,uv).rgb;
  c=clamp(c*1.22+vec3(0.014,0.012,0.010),0.0,1.0);
  return pow(c,vec3(0.94));
}
vec3 stroke(vec2 uv,vec2 d,float len,float k){
  vec3 acc=vec3(0.0);float ws=0.0;
  for(int i=-7;i<=7;i++){
    float f=float(i);
    float w=exp(-f*f*k);
    acc+=S(uv+d*uTexel*f*len)*w;
    ws+=w;
  }
  return acc/ws;
}
vec3 kuw(vec2 uv,vec2 dir,float rad){
  vec2 n=normalize(dir+vec2(0.0001,0.0001));
  vec2 p=vec2(-n.y,n.x);
  vec3 best=vec3(0.0);float bv=1e9;
  for(int s=0;s<4;s++){
    vec2 d;
    if(s==0)d=n;else if(s==1)d=-n;else if(s==2)d=p;else d=-p;
    vec3 sum=vec3(0.0),sq=vec3(0.0);
    for(int i=-2;i<=2;i++){
      for(int j=-2;j<=2;j++){
        vec3 cc=S(uv+(d*float(i)+p*float(j))*uTexel*rad);
        sum+=cc;sq+=cc*cc;
      }
    }
    vec3 m=sum/25.0;
    vec3 v=sq/25.0-m*m;
    float vv=v.r+v.g+v.b;
    if(vv<bv){bv=vv;best=m;}
  }
  return best;
}
void main(){
  float t=clamp(uAmt,0.0,1.0);
  vec3 raw=texture2D(uTex,vUv).rgb;

  vec3 a=S(vUv+vec2(-2.0,-2.0)*uTexel);
  vec3 b=S(vUv+vec2( 2.0,-2.0)*uTexel);
  vec3 cc=S(vUv+vec2(-2.0, 2.0)*uTexel);
  vec3 d=S(vUv+vec2( 2.0, 2.0)*uTexel);
  float gx=(lum(b)+lum(d))-(lum(a)+lum(cc));
  float gy=(lum(cc)+lum(d))-(lum(a)+lum(b));
  vec2 dir=vec2(-gy,gx);
  if(length(dir)<0.002) dir=vec2(1.0,0.42);

  vec2 n1=normalize(dir);
  vec2 n2=normalize(dir+vec2(0.55,-0.45));

  vec3 kv=kuw(vUv,dir,2.0);
  vec3 s1=stroke(vUv,n1,4.0,0.028);
  vec3 s2=stroke(vUv,n2,1.8,0.060);
  vec3 oil=mix(kv,s1,0.50);
  oil=mix(oil,s2,0.26);

  float th1=fbm(vUv*vec2(190.0,110.0));
  float th2=fbm(vUv*vec2(58.0,34.0)+9.1);
  oil*=0.72+0.56*th1;
  oil+=vec3(0.042,0.020,-0.012)*(th2-0.5)*2.2;

  float gg=lum(oil);
  oil=mix(vec3(gg),oil,1.45);
  oil=mix(oil,oil*vec3(1.12,1.00,0.84),0.75);
  oil+=vec3(0.040,0.022,0.000)*smoothstep(0.15,0.75,1.0-gg)*0.9;

  float warp=sin(vUv.x*2300.0)*0.5+0.5;
  float weft=sin(vUv.y*2300.0)*0.5+0.5;
  oil+=(warp*weft-0.25)*0.048;
  oil+=(hash2(gl_FragCoord.xy*0.83)-0.5)*0.022;
  float bristle=vnoise(vec2(vUv.x*620.0,vUv.y*95.0));
  oil+=(bristle-0.5)*0.028;

  vec2 q=vUv-0.5;
  oil*=1.0-dot(q,q)*0.62;
  oil+=vec3(0.048,0.024,0.004)*(1.0-length(q)*1.6);

  float mask=smoothstep(0.028,0.090,lum(raw));
  vec3 merged=mix(raw,oil,mask);
  gl_FragColor=vec4(clamp(mix(raw,merged,t),0.0,1.0),1.0);
}`;

const FS_POST_PLAIN=`precision mediump float;varying vec2 vUv;uniform sampler2D uTex;
void main(){gl_FragColor=vec4(texture2D(uTex,vUv).rgb,1.0);}`;

/* 离屏 FBO：3D 场景先画到纹理，再统一做后处理 */
let fbo=null, fboTex=null, fboW=0, fboH=0;
function ensureFBO(w,h){
  if(fbo && fboW===w && fboH===h) return;
  if(fbo){ gl.deleteFramebuffer(fbo); gl.deleteTexture(fboTex); }
  fboW=w; fboH=h;
  fboTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,fboTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,fboTex,0);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}

/* 质感模式：0 原画 / 1 漫画 / 2 油画 */
let styleMode=0, styleAmt=0, styleTarget=0;
function drawPost(){
  const P = styleMode===1?P_POST_COMIC : styleMode===2?P_POST_OIL : P_POST_PLAIN;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.disable(gl.BLEND);
  gl.useProgram(P.program);
  gl.bindBuffer(gl.ARRAY_BUFFER,postQuad);
  gl.enableVertexAttribArray(P.a.aPos);
  gl.vertexAttribPointer(P.a.aPos,2,gl.FLOAT,false,0,0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,fboTex);
  gl.uniform1i(P.u.uTex,0);
  if(P.u.uTexel) gl.uniform2f(P.u.uTexel,1/fboW,1/fboH);
  if(P.u.uAmt) gl.uniform1f(P.u.uAmt,styleAmt);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* uniformMatrix3fv(transpose=false) 按列读取，所以这里直接给列主序 */
function hueRotMat(deg){
  const a=deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  const r0=0.213+c*0.787-s*0.213, r1=0.715-c*0.715-s*0.715, r2=0.072-c*0.072+s*0.928;
  const g0=0.213-c*0.213+s*0.143, g1=0.715+c*0.285+s*0.140, g2=0.072-c*0.072-s*0.283;
  const b0=0.213-c*0.213-s*0.787, b1=0.715-c*0.715+s*0.715, b2=0.072+c*0.928+s*0.072;
  return [r0,g0,b0, r1,g1,b1, r2,g2,b2];   // 列主序 = 上面矩阵的转置
}

/* 角色编号：决定该顶点跟随哪一套主题色 */
const R={TREE:0,RIB:1,BEAD:2,TIER:3,ORN:4,STARORN:5,BOW:6,KNOT:7,GIFT:8,LID:9,CROSS:10,TOPSTAR:11,
         FOLIAGE:12,SPARK:13,RINGP:14,LIGHT:15,STARDUST:16,SNOW:17,STARS:18,WISH:19};
let CUR_ROLE=0, CUR_LOCK=0;
function Mesh(){return {p:[],n:[],c:[],a:[],s:[],r:[],l:[]};}
function tri(m,a,b,c,col,al,sh){
  const ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2];
  const vx=c[0]-a[0],vy=c[1]-a[1],vz=c[2]-a[2];
  let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
  const l=Math.hypot(nx,ny,nz)||1;nx/=l;ny/=l;nz/=l;
  [a,b,c].forEach(p=>{m.p.push(p[0],p[1],p[2]);m.n.push(nx,ny,nz);m.c.push(col[0],col[1],col[2]);m.a.push(al);m.s.push(sh);m.r.push(CUR_ROLE);m.l.push(CUR_LOCK);});
}
function quad(m,a,b,c,d,col,al,sh){tri(m,a,b,c,col,al,sh);tri(m,a,c,d,col,al,sh);}
function sphere(m,cx,cy,cz,r,col,al,sh,su=9,sv=6){
  for(let i=0;i<sv;i++){
    const t0=i/sv*Math.PI,t1=(i+1)/sv*Math.PI;
    for(let j=0;j<su;j++){
      const p0=j/su*TAU,p1=(j+1)/su*TAU;
      const A=[cx+r*Math.sin(t0)*Math.cos(p0),cy+r*Math.cos(t0),cz+r*Math.sin(t0)*Math.sin(p0)];
      const B=[cx+r*Math.sin(t0)*Math.cos(p1),cy+r*Math.cos(t0),cz+r*Math.sin(t0)*Math.sin(p1)];
      const C=[cx+r*Math.sin(t1)*Math.cos(p1),cy+r*Math.cos(t1),cz+r*Math.sin(t1)*Math.sin(p1)];
      const D=[cx+r*Math.sin(t1)*Math.cos(p0),cy+r*Math.cos(t1),cz+r*Math.sin(t1)*Math.sin(p0)];
      tri(m,A,B,C,col,al,sh);tri(m,A,C,D,col,al,sh);
    }
  }
}
function box(m,cx,cy,cz,sx,sy,sz,ry,col,al,sh){
  const c=Math.cos(ry),s=Math.sin(ry);
  const P=(x,y,z)=>[cx+x*c+z*s,cy+y,cz-x*s+z*c];
  const v=[P(-sx,-sy,-sz),P(sx,-sy,-sz),P(sx,sy,-sz),P(-sx,sy,-sz),
           P(-sx,-sy,sz),P(sx,-sy,sz),P(sx,sy,sz),P(-sx,sy,sz)];
  [[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]].forEach(q=>quad(m,v[q[0]],v[q[1]],v[q[2]],v[q[3]],col,al,sh));
}
/* 五角星（非十角，标准五芒） */
function star5(m,cx,cy,cz,rOut,rIn,thick,rot,tilt,col,al,sh){
  const N=10,front=[],back=[];
  for(let i=0;i<N;i++){
    const ang=rot+i/N*TAU,r=(i%2===0)?rOut:rIn;
    const x=Math.cos(ang)*r,y=Math.sin(ang)*r;
    const y2=y*Math.cos(tilt),z2=y*Math.sin(tilt);
    front.push([cx+x,cy+y2,cz+z2+thick]);
    back.push([cx+x,cy+y2,cz+z2-thick]);
  }
  const cf=[cx,cy,cz+thick], cb=[cx,cy,cz-thick];
  for(let i=0;i<N;i++){
    const j=(i+1)%N;
    tri(m,cf,front[i],front[j],col,al,sh);
    tri(m,cb,back[j],back[i],col,al,sh);
    quad(m,front[i],front[j],back[j],back[i],col,al,sh);
  }
}
function tube(m,pts,rad,col,al,sh,segs=5){
  let prev=null;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],pa=pts[Math.max(0,i-1)],pb=pts[Math.min(pts.length-1,i+1)];
    let tx=pb[0]-pa[0],ty=pb[1]-pa[1],tz=pb[2]-pa[2];
    const tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
    let nx=-tz,ny=0,nz=tx;
    let nl=Math.hypot(nx,ny,nz);
    if(nl<1e-4){nx=1;ny=0;nz=0;nl=1;}nx/=nl;ny/=nl;nz/=nl;
    const bx=ty*nz-tz*ny,by=tz*nx-tx*nz,bz=tx*ny-ty*nx;
    const ring=[];
    for(let s=0;s<=segs;s++){
      const ang=s/segs*TAU,ca=Math.cos(ang),sa=Math.sin(ang);
      ring.push([p[0]+(nx*ca+bx*sa)*rad,p[1]+(ny*ca+by*sa)*rad,p[2]+(nz*ca+bz*sa)*rad]);
    }
    if(prev)for(let s=0;s<segs;s++)quad(m,prev[s],prev[s+1],ring[s+1],ring[s],col,al,sh);
    prev=ring;
  }
}

  const cBot=[0.075,0.250,0.190], cMid=[0.070,0.215,0.195], cTop=[0.150,0.105,0.285];
  for(let i=0;i<SV;i++){

      const p0=mk(t0,a0),p1=mk(t0,a1),p2=mk(t1,a1),p3=mk(t1,a0);
      const t=(t0+t1)/2;

      else{const k=t/0.58;c=[lerp(cBot[0],cMid[0],k),lerp(cBot[1],cMid[1],k),lerp(cBot[2],cMid[2],k)];}

})();

/* 把装饰列表重建为一份网格（每次改动后调用） */
const SM_DECOR=Mesh();
let MB_DECOR=null;
function rebuildDecor(){
  SM_DECOR.p.length=0;SM_DECOR.n.length=0;SM_DECOR.c.length=0;
  SM_DECOR.a.length=0;SM_DECOR.s.length=0;SM_DECOR.r.length=0;SM_DECOR.l.length=0;
  const rgb=(hex)=>{

  };
  decorations.forEach(d=>{
    const r=coneR(d.t)*1.025;
    const x=Math.cos(d.th)*r, y=d.t*H, z=Math.sin(d.th)*r;
    const col=rgb(DECOR_COLORS[d.c]||'#ffffff');
    const kind=DECOR_KINDS[d.k]?DECOR_KINDS[d.k].id:'ball';
    if(kind==='ball'){
      sphere(SM_DECOR,x,y,z,0.030,col,1.0,1.45,11,8);
    }else if(kind==='star'){
      star5(SM_DECOR,x,y,z,0.040,0.017,0.007,d.th,0.35,col,1.0,1.6);
    }else if(kind==='gift'){
      const s=0.040;
      box(SM_DECOR,x,y,z,s*0.90,s*0.80,s*0.90,-d.th,col,1.0,0.55);
      box(SM_DECOR,x,y+s*0.92,z,s*0.94,s*0.11,s*0.94,-d.th,[1,.97,.92],1.0,0.6);
      box(SM_DECOR,x,y,z,s*0.14,s*0.86,s*0.92,-d.th,[1,.97,.94],1.0,0.75);
    }else{
      /* 铃铛：倒置小锥 + 顶环 */
      const ring=[];
      for(let i=0;i<=14;i++){
        const a=i/14*TAU;
        ring.push([x+Math.cos(a)*0.016, y+0.048, z+Math.sin(a)*0.016]);
      }
      tube(SM_DECOR,ring,0.005,col,1.0,1.5,4);
      for(let i=0;i<8;i++){
        const a0=i/8*TAU,a1=(i+1)/8*TAU;
        const y0=y+0.040,y1=y-0.034;
        const A=[x+Math.cos(a0)*0.012,y0,z+Math.sin(a0)*0.012];
        const B=[x+Math.cos(a1)*0.012,y0,z+Math.sin(a1)*0.012];
        const C=[x+Math.cos(a1)*0.034,y1,z+Math.sin(a1)*0.034];
        const D=[x+Math.cos(a0)*0.034,y1,z+Math.sin(a0)*0.034];
        quad(SM_DECOR,A,B,C,D,col,1.0,1.5);
      }
      sphere(SM_DECOR,x,y-0.040,z,0.010,col,1.0,1.6,8,6);
    }
  });
  if(MB_DECOR){
    gl.bindBuffer(gl.ARRAY_BUFFER,MB_DECOR.p);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(SM_DECOR.p),gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,MB_DECOR.n);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(SM_DECOR.n),gl.DYNAMIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER,MB_DECOR.c);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(SM_DECOR.c),gl.DYNAMIC_DRAW);

    gl.bindBuffer(gl.ARRAY_BUFFER,MB_DECOR.s);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(SM_DECOR.s),gl.DYNAMIC_DRAW);
  }else{
    MB_DECOR=upload(SM_DECOR);
  }
  MB_DECOR.count=SM_DECOR.p.length/3;
  if(typeof syncHash==='function') syncHash();
}

/* 屏幕坐标 → 树表面参数(t, θ) */
function pickTree(px,py){
  const p=screenToWorld(px,py);
  const t=clamp(p[1]/H, 0.02, 0.985);
  const r=coneR(t)*1.025;
  const x=clamp(p[0], -r*0.98, r*0.98);
  const z=Math.sqrt(Math.max(0, r*r-x*x));     // 取朝向镜头的一面
  return {t, th:Math.atan2(z,x)};
}

/* ---------- URL hash 编解码 ---------- */
function syncHash(){
  const parts=[];
  if(themeTarget!==0) parts.push('c='+THEMES[themeTarget].id);
  if(decorations.length){
    parts.push('d='+decorations.map(d=>
      Math.round(d.t*999).toString(36)+'.'+Math.round((d.th/(Math.PI*2)+0.5)*3599).toString(36)
      +'.'+d.k+'.'+d.c
    ).join('_'));
  }
  const h=parts.join('&');
  const url=location.pathname+location.search+(h?'#'+h:'');
  try{ history.replaceState(null,'',url); }catch(_){}
}
function applyHash(){
  const h=location.hash.replace(/^#/,'');
  if(!h) return;
  const q=new URLSearchParams(h.replace(/&/g,'&'));
  const c=q.get('c');
  if(c){
    const i=THEMES.findIndex(x=>x.id===c);
    if(i>=0) setTheme(i);
  }
  const d=q.get('d');
  if(d){
    decorations=[];
    d.split('_').forEach(seg=>{
      const a=seg.split('.');
      if(a.length<4) return;
      const t=parseInt(a[0],36)/999;
      const th=(parseInt(a[1],36)/3599-0.5)*Math.PI*2;
      const k=parseInt(a[2],10), col=parseInt(a[3],10);
      if(isFinite(t)&&isFinite(th)) decorations.push({t:clamp(t,0,1), th, k:k||0, c:col||0});
    });
  }
}

  btnSnow.textContent=snowOn?'暂停飘雪':'继续飘雪';
  btnSnow.classList.toggle('on',!snowOn);
});
function screenToWorld(px,py){
  const nx=(px/W)*2-1,ny=1-(py/Hh)*2;
  const halfH=Math.tan(FOV/2)*camZ;
  return [(nx-shift)*halfH*(W/Hh),camY+ny*halfH,0];
}
function doWish(x,y){
  const p=(x!==undefined)?screenToWorld(x,y):[0,H*0.42,0];
  spawnWish(p[0],p[1],p[2],1.55,150);
  wishFx.t=clock; wishFx.x=p[0]; wishFx.y=p[1]; wishFx.z=p[2];
  gl.bindBuffer(gl.ARRAY_BUFFER,flareWishBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([p[0],p[1],p[2]]),gl.DYNAMIC_DRAW);
  lastWish=clock;
}
document.getElementById('btnWish').addEventListener('click',e=>{e.stopPropagation();doWish();});
document.getElementById('btnFull').addEventListener('click',e=>{
  e.stopPropagation();
  if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});
  else document.exitFullscreen?.();
});
window.addEventListener('pointerdown',e=>{
  if(e.target.closest('.dock')||e.target.closest('.palette')||e.target.closest('.style-slider'))return;
  if(decorMode){
    const p=pickTree(e.clientX,e.clientY);
    decorations.push({t:p.t, th:p.th, k:decorKind, c:decorColor});
    rebuildDecor();
    decorHint.classList.remove('show');
    return;
  }
  doWish(e.clientX,e.clientY);
});
window.addEventListener('resize',resize);

/* ---------- 绘制 ---------- */
let clock=0,last=performance.now();const themeT={mat:hueRotMat(THEMES[0].deg),tint:THEMES[0].tint.slice(),sat:THEMES[0].sat,lift:THEMES[0].lift.slice(),dark:THEMES[0].dark.slice(),flare:THEMES[0].flare.slice()};
const bgT={bg:THEMES[0].box.bg.slice(),bgDeep:THEMES[0].box.bgDeep.slice(),
           glow1:THEMES[0].box.glow1.slice(),glow2:THEMES[0].box.glow2.slice()};
function applyGrade(P){
  if(P.u.uHue) gl.uniformMatrix3fv(P.u.uHue,false,themeT.mat);
  if(P.u.uTint) gl.uniform3fv(P.u.uTint,themeT.tint);
  if(P.u.uLift) gl.uniform3fv(P.u.uLift,themeT.lift);
  if(P.u.uDark) gl.uniform3fv(P.u.uDark,themeT.dark);
  if(P.u.uLockAmt) gl.uniform1f(P.u.uLockAmt,0.0);
  if(P.u.uSat) gl.uniform1f(P.u.uSat,themeT.sat);
}
function bindPt(o){
  gl.enableVertexAttribArray(P_PT.a.aPos);gl.bindBuffer(gl.ARRAY_BUFFER,o.pb);gl.vertexAttribPointer(P_PT.a.aPos,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_PT.a.aCol);gl.bindBuffer(gl.ARRAY_BUFFER,o.cb);gl.vertexAttribPointer(P_PT.a.aCol,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_PT.a.aSize);gl.bindBuffer(gl.ARRAY_BUFFER,o.szb);gl.vertexAttribPointer(P_PT.a.aSize,1,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_PT.a.aSeed);gl.bindBuffer(gl.ARRAY_BUFFER,o.sdb);gl.vertexAttribPointer(P_PT.a.aSeed,1,gl.FLOAT,false,0,0);
}
function bindMesh(o){
  gl.enableVertexAttribArray(P_MS.a.aPos);gl.bindBuffer(gl.ARRAY_BUFFER,o.p);gl.vertexAttribPointer(P_MS.a.aPos,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_MS.a.aNrm);gl.bindBuffer(gl.ARRAY_BUFFER,o.n);gl.vertexAttribPointer(P_MS.a.aNrm,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_MS.a.aCol);gl.bindBuffer(gl.ARRAY_BUFFER,o.c);gl.vertexAttribPointer(P_MS.a.aCol,3,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_MS.a.aAlpha);gl.bindBuffer(gl.ARRAY_BUFFER,o.a);gl.vertexAttribPointer(P_MS.a.aAlpha,1,gl.FLOAT,false,0,0);
  gl.enableVertexAttribArray(P_MS.a.aShine);gl.bindBuffer(gl.ARRAY_BUFFER,o.s);gl.vertexAttribPointer(P_MS.a.aShine,1,gl.FLOAT,false,0,0);
}
function setPt(t,grow,alpha,rot,shiftMul,twinkle){
  gl.uniformMatrix4fv(P_PT.u.uProj,false,proj);
  gl.uniformMatrix4fv(P_PT.u.uView,false,view);
  gl.uniform1f(P_PT.u.uFocal,focal);
  gl.uniform1f(P_PT.u.uTime,t);
  gl.uniform1f(P_PT.u.uGrow,grow);
  gl.uniform1f(P_PT.u.uR0,R0);
  gl.uniform1f(P_PT.u.uShift,shift*shiftMul);
  gl.uniform1f(P_PT.u.uShiftY,shiftY*shiftMul);
  gl.uniform1f(P_PT.u.uAlpha,alpha);
  gl.uniform1f(P_PT.u.uTwinkle,twinkle);
  gl.uniform1f(P_PT.u.uRot,rot);
  applyGrade(P_PT);
}
function drawMesh(o,grow,alpha,rot){
  bindMesh(o);
  gl.uniformMatrix4fv(P_MS.u.uProj,false,proj);
  gl.uniformMatrix4fv(P_MS.u.uView,false,view);
  gl.uniform1f(P_MS.u.uGrow,grow);
  gl.uniform1f(P_MS.u.uR0,R0);
  gl.uniform1f(P_MS.u.uShift,shift);
  gl.uniform1f(P_MS.u.uShiftY,shiftY);
  gl.uniform1f(P_MS.u.uAlpha,alpha);
  gl.uniform1f(P_MS.u.uRot,rot);
  gl.uniform3f(P_MS.u.uLight,0.55,0.72,0.78);
  gl.uniform3f(P_MS.u.uFill,-0.72,0.06,0.55);
  gl.uniform3f(P_MS.u.uCam,0,camY,camZ);
  applyGrade(P_MS);
  gl.drawArrays(gl.TRIANGLES,0,o.count);
}
function drawDecorMesh(grow,alpha,rot){
  bindMesh(MB_DECOR);
  gl.uniformMatrix4fv(P_MS.u.uProj,false,proj);
  gl.uniformMatrix4fv(P_MS.u.uView,false,view);
  gl.uniform1f(P_MS.u.uGrow,grow);
  gl.uniform1f(P_MS.u.uR0,R0);
  gl.uniform1f(P_MS.u.uShift,shift);
  gl.uniform1f(P_MS.u.uShiftY,shiftY);
  gl.uniform1f(P_MS.u.uAlpha,alpha);
  gl.uniform1f(P_MS.u.uRot,rot);
  gl.uniform3f(P_MS.u.uLight,0.55,0.72,0.78);
  gl.uniform3f(P_MS.u.uFill,-0.72,0.06,0.55);
  gl.uniform3f(P_MS.u.uCam,0,camY,camZ);
  /* 用户装饰保持自己选的颜色，不做主题旋转 */
  if(P_MS.u.uLockAmt) gl.uniform1f(P_MS.u.uLockAmt,1.0);
  gl.uniform3fv(P_MS.u.uHue,[1,0,0, 0,1,0, 0,0,1]);
  gl.uniform3fv(P_MS.u.uTint,[1,1,1]);
  gl.uniform3fv(P_MS.u.uLift,[0,0,0]);
  gl.uniform1f(P_MS.u.uSat,1.0);
  gl.drawArrays(gl.TRIANGLES,0,MB_DECOR.count);
  applyGrade(P_MS);
  if(P_MS.u.uLockAmt) gl.uniform1f(P_MS.u.uLockAmt,0.0);
}
function drawSnow(t,dt){
  const b=snow.base;
  for(let i=0;i<SNOW_N;i++){
    const s=b[i];
    if(snowOn){
      s.y-=s.v*dt;
      s.x+=Math.sin(t*0.4+s.p)*0.0006;
      if(s.y<-1.0){s.y=6.2+rnd(0,1.0);s.x=rnd(-7.0,7.0);}
    }
    snow.pos[i*3]=s.x+Math.sin(t*0.55+s.p)*0.15;
    snow.pos[i*3+1]=s.y;
    snow.pos[i*3+2]=s.z+Math.cos(t*0.43+s.p)*0.10;
  }
  gl.useProgram(P_PT.program);
  setPt(t,1.0,0.70*clamp(t/2.4,0,1),0.0,0.42,0.45);
  bindPt(snow);
  gl.bindBuffer(gl.ARRAY_BUFFER,snow.pb);
  gl.bufferData(gl.ARRAY_BUFFER,snow.pos,gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.POINTS,0,SNOW_N);
}
function updateWish(dt){
  if(dt<=0)return;
  let any=false;
  for(let i=0;i<WISH_N;i++){
    const s=wish.st[i];
    if(!s.alive)continue;
    any=true;
    s.life+=dt;
    if(s.life>s.max){s.alive=false;wish.pos[i*3+1]=-999;continue;}
    s.vy-=0.13*dt;
    s.vx*=0.986;s.vz*=0.986;s.vy*=0.993;
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;
    wish.pos[i*3]=s.x;wish.pos[i*3+1]=s.y;wish.pos[i*3+2]=s.z;
  }
  if(any){
    gl.bindBuffer(gl.ARRAY_BUFFER,wish.pb);
    gl.bufferData(gl.ARRAY_BUFFER,wish.pos,gl.DYNAMIC_DRAW);
  }
}
function drawFlare(t,starA){
  if(starA<=0.004)return;
  const pulse=0.60+0.40*Math.sin(t*1.6);
  gl.useProgram(P_FL.program);
  gl.uniformMatrix4fv(P_FL.u.uProj,false,proj);
  gl.uniformMatrix4fv(P_FL.u.uView,false,view);
  gl.uniform1f(P_FL.u.uShift,shift);
  gl.uniform1f(P_FL.u.uShiftY,shiftY);
  gl.uniform1f(P_FL.u.uFocal,focal);
  gl.uniform3fv(P_FL.u.uTint,themeT.flare);
  gl.enableVertexAttribArray(P_FL.a.aPos);
  gl.bindBuffer(gl.ARRAY_BUFFER,flareBuf);
  gl.vertexAttribPointer(P_FL.a.aPos,3,gl.FLOAT,false,0,0);
  gl.uniform1f(P_FL.u.uSize,0.62);
  gl.uniform1f(P_FL.u.uIntensity,starA*(0.42+pulse*0.20));
  gl.drawArrays(gl.POINTS,0,1);
  gl.uniform1f(P_FL.u.uSize,1.9);
  gl.uniform1f(P_FL.u.uIntensity,starA*0.085);
  gl.drawArrays(gl.POINTS,0,1);
  gl.uniform1f(P_FL.u.uSize,3.6);
  gl.uniform1f(P_FL.u.uIntensity,starA*0.022);
  gl.drawArrays(gl.POINTS,0,1);
}

function frame(now){
  const dt=FIXED_T!==null?0:Math.min(0.05,(now-last)/1000);
  last=now;
  if(FIXED_T===null)clock+=dt;
  const t=FIXED_T!==null?FIXED_T:clock;
  const S=sceneState(t);
  if(FIXED_T===null) stepTheme(dt); else stepTheme(1);

  ensureFBO(canvas.width,canvas.height);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.004,0.003,0.010,1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.disable(gl.BLEND);
  gl.useProgram(P_BG.program);
  gl.bindBuffer(gl.ARRAY_BUFFER,bgBuf);
  gl.enableVertexAttribArray(P_BG.a.aPos);
  gl.vertexAttribPointer(P_BG.a.aPos,2,gl.FLOAT,false,0,0);
  gl.uniform3fv(P_BG.u.uBg,bgT.bg);
  gl.uniform3fv(P_BG.u.uBgDeep,bgT.bgDeep);
  gl.uniform3fv(P_BG.u.uGlow1,bgT.glow1);
  gl.uniform3fv(P_BG.u.uGlow2,bgT.glow2);
  gl.drawArrays(gl.TRIANGLES,0,3);

  /* 树体（普通 alpha 混合） */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P_MS.program);
  drawMesh(MB,S.grow,S.alpha,S.rot);
  if(S.starA>0.01){
    drawStarMesh(MB_STAR,S.grow*lerp(0.40,1.0,clamp(S.star,0,1)),S.starA,S.rot);
  }

  /* 用户自定义装饰 */
  if(MB_DECOR && MB_DECOR.count>0){
    gl.useProgram(P_MS.program);
    drawDecorMesh(S.grow,S.alpha,S.rot);
  }

  /* 粒子（加色） */
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
  gl.useProgram(P_PT.program);
  setPt(t,S.grow,S.alpha*0.92,S.rot,1.0,0.5);
  bindPt(FOLIAGE);gl.drawArrays(gl.POINTS,0,FOLIAGE.count);
  setPt(t,S.grow,S.alpha*1.0,S.rot,1.0,1.0);
  bindPt(SPARKS);gl.drawArrays(gl.POINTS,0,SPARKS.count);
  setPt(t,S.grow,S.alpha*0.95,S.rot,1.0,0.4);
  bindPt(RINGP);gl.drawArrays(gl.POINTS,0,RINGP.count);
  setPt(t,S.grow,S.alpha*1.0,S.rot,1.0,0.85);
  bindPt(LIGHTSTRINGS);gl.drawArrays(gl.POINTS,0,LIGHTSTRINGS.count);
  if(S.starA>0.01){
    setPt(t,S.grow,clamp(S.star,0,1)*0.85,S.rot,1.0,1.0);
    bindPt(STARDUST);gl.drawArrays(gl.POINTS,0,STARDUST.count);
  }

  drawSnow(t,dt);
  gl.useProgram(P_PT.program);
  setPt(t,1.0,0.55,S.rot*0.35,0.20,0.75);
  bindPt(stars);gl.drawArrays(gl.POINTS,0,stars.count);
  drawFlare(t,S.starA);

  /* 许愿闪爆：起手一记暖光 */
  if(FIXED_T===null){
    const age=t-wishFx.t;
    if(age>=0 && age<1.1){
      const k=1-age/1.1;
      gl.useProgram(P_FL.program);
      gl.uniformMatrix4fv(P_FL.u.uProj,false,proj);
      gl.uniformMatrix4fv(P_FL.u.uView,false,view);
      gl.uniform1f(P_FL.u.uShift,shift);
      gl.uniform1f(P_FL.u.uShiftY,shiftY);
      gl.uniform1f(P_FL.u.uFocal,focal);
      gl.uniform3f(P_FL.u.uTint,1.0,0.78,0.88);
      gl.enableVertexAttribArray(P_FL.a.aPos);
      gl.bindBuffer(gl.ARRAY_BUFFER,flareWishBuf);
      gl.vertexAttribPointer(P_FL.a.aPos,3,gl.FLOAT,false,0,0);
      gl.uniform1f(P_FL.u.uSize,0.34+0.55*(1-k));
      gl.uniform1f(P_FL.u.uIntensity,k*k*0.85);
      gl.drawArrays(gl.POINTS,0,1);
    }
  }

  updateWish(dt);
  gl.useProgram(P_PT.program);
  setPt(t,1.0,1.0,0.0,1.0,0.85);
  bindPt(wish);
  gl.bindBuffer(gl.ARRAY_BUFFER,wish.pb);
  gl.bufferData(gl.ARRAY_BUFFER,wish.pos,gl.DYNAMIC_DRAW);
  gl.drawArrays(gl.POINTS,0,WISH_N);

  /* 后处理：质感风格 */
  if(styleMode!==0 || styleAmt>0.002) drawPost();
  else { gl.bindFramebuffer(gl.FRAMEBUFFER,null); }   /* 原画直接显示 */

  requestAnimationFrame(frame);
}

/* ---------- UI 时间线 ---------- */
const noelEl=document.getElementById('noel');
function uiTick(){
  if(FIXED_T!==null){
    textEls.forEach((el,i)=>el.classList.toggle('in',FIXED_T>TEXT_AT[i]));
    dock.classList.toggle('show',FIXED_T>2.2);
    document.getElementById('arch').classList.toggle('show',FIXED_T>1.1);
    noelEl.classList.toggle('show',FIXED_T>1.0 && FIXED_T<8.6);
    return;
  }
  const t=clock;
  textEls.forEach((el,i)=>el.classList.toggle('in',t>TEXT_AT[i]));
  if(t>2.1){
    dock.classList.add('show');
    document.getElementById('arch').classList.add('show');
  }
  noelEl.classList.toggle('show', t>1.0 && t<8.6);
  tip.classList.toggle('show',t>5.2&&t<11.0);
  if(t>nextAutoWish&&t-lastWish>2.0){doWish();nextAutoWish=t+15.0;}
  requestAnimationFrame(uiTick);
}

applyHash();
rebuildDecor();
resize();
requestAnimationFrame(t=>{last=t;frame(t);});
uiTick();
</script>
</body>
</html>
